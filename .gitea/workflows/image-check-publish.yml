name: Docker Image CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main", "develop" ]

# The built-in GITEA_TOKEN is NOT accepted by the container registry (verified on this
# instance: runs #2 and #3 failed with `GET /v2/: unauthorized`, both with and without
# `packages: write`). The registry push below authenticates with the REGISTRY_TOKEN PAT
# instead — same as the other repos in this org.
permissions:
  contents: read   # checkout

# Two quick pushes to main start two runs that race: the older one can finish last and
# publish its `latest` after the newer one, so watchtower would roll production back to
# the previous commit on a perfectly green build. Serialising per ref makes the last
# push win. Cancellation stays off on purpose — cancelling the older run would also
# discard its `sha-<commit>` image, which is the immutable rollback target for that
# commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Pull requests only build, so a broken Dockerfile is caught before merge and no
    # credentials are needed for the run.
    - name: Log in to the Gitea container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        # The repo belongs to an organisation, so `github.repository_owner` is the org name,
        # not a login: docker login takes `github.actor`, the user who triggered the run.
        username: ${{ github.repository_owner }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Compute image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: gitea.vvzvlad.xyz/${{ github.repository }}
        # `latest` is what watchtower deploys to production, so it is pinned to the default
        # branch explicitly rather than via {{is_default_branch}}: a build from any side
        # branch (or a workflow_dispatch run on one) must never overwrite it. The timestamp
        # tag is scoped the same way — it is a rollback target for what production actually
        # runs, and on a side branch it would only be noise. `sha-<commit>` is the immutable
        # tag every non-PR build gets, whichever branch it came from.
        tags: |
          type=raw,value=latest,enable=${{ github.ref_name == 'main' && github.event_name != 'pull_request' }}
          type=ref,event=branch
          type=ref,event=pr
          type=sha,format=long
          type=raw,value={{date 'YYYYMMDD-HHmmss'}},enable=${{ github.ref_name == 'main' && github.event_name != 'pull_request' }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        # amd64 only, deliberately: this is a ~800 MB desktop image and cross-building it
        # for arm64 under QEMU emulation takes hours. No production target needs arm64.
        platforms: linux/amd64
        # Equivalent of `docker build --pull`. The runner is self-hosted with a long-lived
        # daemon, so without this the base image is served from a local cache that can be
        # months old and carries an unpatched system layer into every build.
        pull: true
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        # ignore-error keeps the build green if this Gitea runner has no actions cache
        # service — the cache is an optimisation, not a requirement.
        cache-to: type=gha,mode=max,ignore-error=true
