[Globals]
ListenAddress=127.0.0.1
ListenPort=3350
EnableUserWindowManager=1
UserWindowManager=startwm.sh
DefaultWindowManager=startwm.sh

[Security]
AllowRootLogin=0
MaxLoginRetry=4
TerminalServerUsers=tsusers
TerminalServerAdmins=tsadmins

[Sessions]
X11DisplayOffset=10
MaxSessions=10
KillDisconnected=0
IdleTimeLimit=0
DisconnectedTimeLimit=0

[Logging]
LogFile=/var/log/xrdp-sesman.log
LogLevel=INFO
EnableSyslog=0
SyslogLevel=INFO

; These session types are unused (the only session is the libvnc one in xrdp.ini), but
; -ac would disable X access control entirely, so it is gone. xrdp reads paramN
; sequentially and stops at the first gap, so they must stay numbered contiguously.
[X11rdp]
param1=-bs
param2=-nolisten
param3=tcp

[Xvnc]
param1=-bs
param2=-nolisten
param3=tcp
param4=-localhost
param5=-dpi
param6=96
