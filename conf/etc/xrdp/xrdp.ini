
[globals]
bitmap_cache=yes
bitmap_compression=yes
port=3389
crypt_level=high
channel_code=1
ssl_protocols=TLSv1.2, TLSv1.3
fork=true
use_vsock=false
tcp_nodelay=true
tcp_keepalive=true
security_layer=negotiate
; Without these two, negotiate can never select TLS and silently falls back to plain RDP
; security ("Cannot accept TLS connections because certificate or private key file is not
; readable"). The Dockerfile guarantees both files exist.
certificate=/etc/xrdp/cert.pem
key_file=/etc/xrdp/key.pem
allow_channels=true
allow_multimon=true
bulk_compression=true
max_bpp=32
new_cursors=true
use_fastpath=both

[Logging]
LogFile=xrdp.log
LogLevel=INFO
EnableSyslog=true
SyslogLevel=INFO

; The only session: proxy straight to the x11vnc server on the Xvfb display.
; password= is rewritten at runtime by /usr/local/bin/docker-entrypoint.sh when
; VNC_PASSWORD is set, because libvnc.so has to log into x11vnc with the real password.
[xrdp1]
name=browser
lib=libvnc.so
ip=127.0.0.1
port=5900
username=rdp
password=rdp
