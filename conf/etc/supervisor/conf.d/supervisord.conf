[supervisord]
nodaemon=true
; Declared explicitly so supervisord stops logging "CRIT Supervisor is running as root"
; on every start. It has to be root: it starts xrdp and xrdp-sesman.
user=root
; nodaemon only adds stdout logging, it does not disable the log file: without this
; supervisord keeps its own /var/log/supervisor/supervisord.log (50 MB x 10 rotations)
; inside the container's writable layer, duplicating what already goes to the container log.
logfile=/dev/null
logfile_maxbytes=0

; Control interface. Without it `docker exec <c> supervisorctl restart firefox` fails with
; "unix:///var/run/supervisor.sock refused connection" and the only way to recover a stopped
; program is recreating the container. A unix socket keeps it reachable only from inside.
;
; chmod=0700 (root-only) is the actual access control: programs here run as uid 1000, and
; Firefox renders untrusted web content, so it must not be able to stop or restart anything.
; No username/password is set on purpose - it would add nothing on top of a root-only socket,
; and supervisorctl finds the socket through the packaged /etc/supervisor/supervisord.conf,
; whose [supervisorctl] section carries no credentials, so requiring them would break
; `docker exec <c> supervisorctl` for no gain. supervisord logs one unconditional
; "CRIT Server 'unix_http_server' running without any HTTP authentication checking" line at
; startup because of this; it is expected, and it is the only CRIT in a healthy container.
;
; The path is spelled exactly like the packaged /etc/supervisor/supervisord.conf spells it
; (/var/run/supervisor.sock) on purpose. `supervisorctl` invoked without -c reads that
; packaged file, and its config reader does not process [include], so it never sees this
; file: the two only agree if the strings match. /var/run is a symlink to /run, so writing
; /run/supervisor.sock here happens to work too - but only by coincidence, and that
; coincidence would be silently broken by a base image that stops symlinking /var/run.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; Terminate supervisord as soon as any program gives up, so that Docker's restart policy
; (`restart: unless-stopped` in production) is what recovers the container. See
; /usr/local/bin/supervisor-fatal-exit for why this beats retrying forever in place.
;
; priority is the lowest of all sections so the listener is running before any program can
; fail. stdout is the event protocol channel, so it is discarded and the script logs to
; stderr instead; supervisord routes that to the container log.
[eventlistener:fatal-exit]
command=/usr/local/bin/supervisor-fatal-exit
events=PROCESS_STATE_FATAL
user=root
autorestart=true
startretries=50
priority=1
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; All programs log to the container's stdout instead of files under /tmp that nobody reads.
; X clients are wrapped in wait-for-x because `priority` only orders the spawns, it does
; not wait for Xvfb to be ready.
;
; startretries=50 on every program, including the two xrdp ones: autorestart=true only takes
; effect once a program has stayed up for startsecs, so a program that dies faster than that
; is retried only startretries times (default 3) and then parked in FATAL forever, while the
; container still reports "running". With xrdp that would strand port 3389 - the only port
; production publishes - on a dead listener.
;
; 50 rather than something enormous, because supervisord's BACKOFF delay grows by one second
; per retry and is only reset once a program has stayed up for startsecs: retry n happens n
; seconds after retry n-1, so startretries=1000 degrades into ~16-minute retry intervals
; (and ~5.8 days to exhaust). 50 retries span ~21 minutes of ever-slower attempts and then
; hand over to [eventlistener:fatal-exit], which restarts the whole container - putting every
; program back on a 1-second retry interval.

; Runs as user, not root: with X server 21.1 an MIT-SHM segment created by a uid-1000
; client cannot be attached by a root-owned server, so x11vnc died with
; "X11 MIT Shared Memory Attach failed" / BadAccess on every start. Same uid on both sides
; keeps the shm fast path instead of falling back to -noshm.
;
; Running as uid 1000 also means Xvfb compiles its XKB keymap as that user, and /var/lib/xkb
; - where the X server puts compiled keymaps - is root-owned 0755 in this base image, so it
; cannot write there. Verified on 24.04: nothing is ever created in /var/lib/xkb, the server
; falls back to a temporary file, and xkbcomp only emits "Could not resolve keysym ..."
; warnings that are explicitly not fatal. It is worth knowing that this depends on the base
; image: a change to those permissions, or to the fallback, brings back the "Couldn't open
; compiled keymap file" class of failure, and xvfb would stop coming up at all.
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_RESOLUTION)s +extension RANDR
; HOME/USER are not derived from `user`: supervisord passes its own root environment down,
; so without these the program would run as uid 1000 with HOME=/root and any access to
; $HOME would fail with an obscure EACCES.
environment=HOME="/home/user",USER="user"
user=user
autorestart=true
startretries=50
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:awesome]
environment=HOME="/home/user",DISPLAY=":1",USER="user"
command=/usr/local/bin/wait-for-x /usr/bin/awesome
user=user
autorestart=true
startretries=50
priority=150
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:firefox]
environment=HOME="/home/user",DISPLAY=":1",USER="user"
command=/usr/local/bin/wait-for-x /usr/local/bin/start-firefox
user=user
autorestart=true
startretries=50
priority=200
; Firefox is multi-process: the supervised pid is the parent, and "Web Content" /
; "Socket Process" children are separate processes in the same process group. supervisord
; only ever signals the pid it knows, so without these a `supervisorctl restart firefox`
; that hits stopwaitsecs (SIGKILL to the parent alone) leaves the children behind, holding
; the profile lock and X resources against the newly started Firefox. They are also
; invisible to healthcheck.sh, which matches comm "firefox"/"firefox-bin" while the children
; rename themselves.
;
; stopwaitsecs stays UNDER docker's stop grace period, which is 10s by default for both
; `docker stop` and compose - and 10s in watchtower, which stops the container itself and does
; not read compose's stop_grace_period, so raising that would not fix the one path that
; matters here: the unattended redeploy. supervisord stops groups strictly sequentially in
; descending priority (xrdp 500, xrdp-sesman 400, x11vnc 300, firefox 200), so firefox's wait
; is additive and comes fourth: at 20s the container was guaranteed to be SIGKILLed in the
; middle of the teardown, which is exactly the case stopasgroup exists to handle.
;
; 5s, not 8s: measured on this image, a `docker stop` whose Firefox cannot handle SIGTERM (it
; was SIGSTOPped for the test) spends ~1.8s between docker's SIGTERM and the moment
; supervisord opens firefox's stop window - the three higher-priority groups plus the daemon's
; own latency - and needs ~0.4s afterwards for awesome, xvfb and its own exit. At 8s that
; totalled 9.8-10.3s and docker SIGKILLed the container (exit 137) instead of letting it
; finish; at 5s the same test finishes in ~7s with exit 0.
;
; Nothing is lost by the shorter wait: killasgroup=true SIGKILLs the whole process group,
; children included, so a Firefox that ignores SIGTERM still cannot leave anything holding the
; profile lock, and this image disables session restore anyway, so a killed browser loses
; nothing. `supervisorctl restart firefox` has no grace period over it, but there is no reason
; to wait longer there than the container itself ever gets.
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
; -shared: without it every new RDP client disconnects the previous one, while
; sesman.ini allows up to MaxSessions=10 concurrent ones.
; X11VNC_LISTEN is set by the entrypoint to -localhost when no password is configured.
;
; X11VNC_QUIET is "-q" unless the operator overrides it, and the entrypoint always exports it
; (supervisord refuses to parse a config referencing an unset %(ENV_...)s). At the default
; verbosity every accepted connection logs "Got connection from client" plus
; "rfbClientConnectionGone" on close, and healthcheck.sh connects to 5900 every 30s to check
; the RFB banner - about 3000 lines per day in the container log, which is the only diagnostic
; channel there is (supervisord's own logfile is /dev/null) and which grows without bound under
; the default json-file driver.
;
; It is a variable and not a hard-coded flag because -q is not only about chatter: x11vnc
; routes nearly everything through rfbLog, non-fatal failures included - "X11 MIT Shared
; Memory Attach failed" / BadAccess, the message that diagnosed this image's shm/uid problem,
; is one of them. `-e X11VNC_QUIET=` restores full verbosity without a rebuild and is the first
; thing to do when x11vnc misbehaves.
command=/usr/local/bin/wait-for-x /usr/bin/x11vnc -display :1 %(ENV_X11VNC_AUTH)s %(ENV_X11VNC_LISTEN)s -shared -wait 5 -forever -xrandr %(ENV_X11VNC_QUIET)s
; HOME/USER as for xvfb: x11vnc touches ~/.vnc and ~/.Xauthority on some code paths and
; would otherwise try to do so under HOME=/root as uid 1000.
environment=HOME="/home/user",DISPLAY=":1",USER="user"
user=user
autorestart=true
startretries=50
priority=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
user=root
process_name=xrdp-sesman
autorestart=true
startretries=50
priority=400
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xrdp]
command=/usr/sbin/xrdp -nodaemon
user=root
process_name=xrdp
autorestart=true
startretries=50
priority=500
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
